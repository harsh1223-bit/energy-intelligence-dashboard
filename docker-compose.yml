services:
  postgres:
    image: postgres:16-alpine
    container_name: energy-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-energy_db}
      POSTGRES_USER: ${POSTGRES_USER:-energy_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-energy_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - energy_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-energy_user} -d ${POSTGRES_DB:-energy_db}"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  energy_pgdata:
